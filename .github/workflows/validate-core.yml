name: validate pinned GBA core

on:
  push:
    paths:
      - "analysis/pinned-core-capacity.json"
      - "config/remake.json"
      - "tools/bootstrap_pokeemerald_expansion.sh"
      - "tools/audit_pinned_core.py"
      - ".github/workflows/validate-core.yml"
  pull_request:
    paths:
      - "analysis/pinned-core-capacity.json"
      - "config/remake.json"
      - "tools/bootstrap_pokeemerald_expansion.sh"
      - "tools/audit_pinned_core.py"
      - ".github/workflows/validate-core.yml"

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SILVER
        uses: actions/checkout@v4

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: .tools/pokeemerald-expansion

      - name: Verify persistent ID and save capacity baseline
        run: python tools/audit_pinned_core.py .tools/pokeemerald-expansion --check --manifest analysis/pinned-core-capacity.json

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build pinned Emerald core
        working-directory: .tools/pokeemerald-expansion
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 1
          DEPRECATED_ERROR: 1
        run: make -j$(nproc) -O all


      - name: Apply +32-bit per-BoxPokemon Generation-10 storage probe
        run: python tools/probe_gen10_storage_capacity.py .tools/pokeemerald-expansion

      - name: Build storage-capacity probe
        id: storage_probe
        continue-on-error: true
        working-directory: .tools/pokeemerald-expansion
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 1
          DEPRECATED_ERROR: 1
        run: make -j$(nproc) -O all

      - name: Record storage probe outcome
        if: always()
        run: echo "SILVER_BOX_ID_EXTENSION_PROBE=${{ steps.storage_probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
