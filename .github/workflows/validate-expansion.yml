name: validate expansion

on:
  push:
    paths:
      - "analysis/rom-save-baseline.json"
      - "analysis/save-structure-audit.json"
      - "config/expansion.json"
      - "config/legacy_save_profiles.json"
      - "config/legacy_save_layouts.json"
      - "config/gba_save_import_v1.json"
      - "config/expanded_mon_v1.json"
      - "engine/abi/**"
      - "tools/inspect_silver_inputs.py"
      - "tools/detect_legacy_profile.py"
      - "tools/decode_legacy_save.py"
      - "tools/import_legacy_silver.py"
      - "tools/migrate_legacy_mon.py"
      - "tools/validate_expansion.py"
      - "tests/**"
      - ".github/workflows/validate-expansion.yml"
  pull_request:
    paths:
      - "analysis/rom-save-baseline.json"
      - "analysis/save-structure-audit.json"
      - "config/expansion.json"
      - "config/legacy_save_profiles.json"
      - "config/legacy_save_layouts.json"
      - "config/gba_save_import_v1.json"
      - "config/expanded_mon_v1.json"
      - "engine/abi/**"
      - "tools/inspect_silver_inputs.py"
      - "tools/detect_legacy_profile.py"
      - "tools/decode_legacy_save.py"
      - "tools/import_legacy_silver.py"
      - "tools/migrate_legacy_mon.py"
      - "tools/validate_expansion.py"
      - "tests/**"
      - ".github/workflows/validate-expansion.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/validate_expansion.py
      - run: python -m unittest discover -s tests -v
